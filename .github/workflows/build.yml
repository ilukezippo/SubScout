name: Build SubScout.exe

# Builds a standalone Windows exe (no Python needed) and publishes it as the
# GitHub release for the APP_VERSION in SubScout.pyw (e.g. v1.0).
# Pushing again with the same version replaces that release and its tag.
on:
  push:
    branches: [main]
    paths: ["SubScout.pyw", "requirements.txt", "RELEASE_NOTES.md", "packaging/**", "assets/SubScout.ico", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = python packaging/make_version_info.py
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name SubScout
          --icon assets/SubScout.ico
          --version-file packaging/version_info.txt
          --collect-data cloudscraper
          --collect-submodules keyring
          --hidden-import keyring.backends.Windows
          SubScout.pyw

      - name: Smoke test (exe starts, all libraries bundled)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\SubScout.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:LOCALAPPDATA\SubScout\crash_report.txt" -ErrorAction SilentlyContinue
            throw "SubScout.exe --selftest failed with exit code $($p.ExitCode)"
          }
          "Self-test passed. Size: {0:N1} MB" -f ((Get-Item dist\SubScout.exe).Length / 1MB)

      - name: Update test (swap the exe and restart it, like "Update now")
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "updtest"
          New-Item -ItemType Directory $d -Force | Out-Null
          Copy-Item dist\SubScout.exe "$d\SubScout.exe"
          $marker = Join-Path $d "restarted.txt"
          $src = (Resolve-Path dist\SubScout.exe).Path
          Start-Process -FilePath "$d\SubScout.exe" -ArgumentList @("--update-test", "`"$src`"", "--marker", "`"$marker`"") -Wait
          for ($i = 0; $i -lt 90 -and -not (Test-Path $marker); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $marker)) {
            Get-Process | Where-Object { $_.ProcessName -like "SubScout*" } | Format-Table Id, ProcessName, MainWindowTitle | Out-Host
            throw "The exe did not come back after the self-update restart"
          }
          Get-Content $marker

      - name: Single-instance test (a second SubScout is refused while one is open)
        shell: pwsh
        run: |
          $app = Start-Process -FilePath dist\SubScout.exe -PassThru
          Start-Sleep -Seconds 8
          $p = Start-Process -FilePath dist\SubScout.exe -ArgumentList "--instance-check" -Wait -PassThru
          if ($p.ExitCode -ne 3) { throw "Second instance was not detected (exit $($p.ExitCode))" }
          Get-Process | Where-Object { $_.ProcessName -eq "SubScout" } | Stop-Process -Force
          Start-Sleep -Seconds 3
          $p = Start-Process -FilePath dist\SubScout.exe -ArgumentList "--instance-check" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Lock not released after closing (exit $($p.ExitCode))" }
          "Single-instance check passed"

      - uses: actions/upload-artifact@v4
        with:
          name: SubScout-v${{ steps.v.outputs.version }}
          path: dist/SubScout.exe

      - name: Remove the old release and tag for this version (re-publish)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.v.outputs.version }}"
          gh release delete $tag --repo "${{ github.repository }}" --cleanup-tag --yes 2>&1 | Out-Host
          git push origin ":refs/tags/$tag" 2>&1 | Out-Host
          exit 0

      - name: Publish release v${{ steps.v.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SubScout v${{ steps.v.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: dist/SubScout.exe
          make_latest: true
